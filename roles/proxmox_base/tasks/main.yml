---
# Proxmox Base Configuration
# This role handles initial setup for Proxmox VE nodes, including repository management
# and UI adjustments for non-subscription environments.

# --- SSH Configuration ---
# SSH listens on both port 22 (unrestricted, closed at Hetzner level) and custom port (restricted by firewall)

- name: Ensure SSH listens on port 22
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?Port 22$"
    line: "Port 22"
    state: present
  notify: Restart sshd

- name: Ensure SSH listens on custom port
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?Port {{ lookup('env', 'TF_VAR_pm_ssh_port') | default(43030, true) }}$"
    line: "Port {{ lookup('env', 'TF_VAR_pm_ssh_port') | default(43030, true) }}"
    state: present
  notify: Restart sshd

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    state: present
  notify: Restart sshd

- name: Ensure public key authentication is enabled
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PubkeyAuthentication"
    line: "PubkeyAuthentication yes"
    state: present
  notify: Restart sshd

# --- Repository Management ---
# We remove or disable enterprise repositories to avoid 401 errors when no subscription is present.

# Remove the temporary no-subscription list if it exists
- name: Remove temporary no-subscription list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pve-no-subscription.list
    state: absent

# Check if the PVE Enterprise repository sources file exists
- name: Check if PVE Enterprise sources exist
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/pve-enterprise.sources
  register: proxmox_base_pve_enterprise_sources

# Disable the PVE Enterprise repository to prevent 401 errors without a subscription
- name: Disable PVE Enterprise sources
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/pve-enterprise.sources
    regexp: "^Enabled:"
    line: "Enabled: no"
    insertafter: EOF
    state: present
  when: proxmox_base_pve_enterprise_sources.stat.exists

# Check if the Ceph Enterprise repository sources file exists
- name: Check if Ceph Enterprise sources exist
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/ceph.sources
  register: proxmox_base_ceph_sources

# Disable the Ceph Enterprise repository to prevent 401 errors without a subscription
- name: Disable Ceph Enterprise sources
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/ceph.sources
    regexp: "^Enabled:"
    line: "Enabled: no"
    insertafter: EOF
    state: present
  when: proxmox_base_ceph_sources.stat.exists

# Check if the main proxmox.sources file exists
- name: Check if proxmox.sources exist
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/proxmox.sources
  register: proxmox_base_proxmox_sources

# Enable the PVE No-Subscription repository in the main sources file
- name: Ensure PVE No-Subscription is enabled in proxmox.sources
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/proxmox.sources
    regexp: "^Enabled: no"
    replace: "Enabled: yes"
  when: proxmox_base_proxmox_sources.stat.exists

# Clean up the legacy sources.list file as Debian 12 uses debian.sources
- name: Clean up /etc/apt/sources.list (using debian.sources instead)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list
    content: "# Main sources are in /etc/apt/sources.list.d/debian.sources\n"
    mode: "0644"

# --- System Updates ---

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false

# --- UI Tweaks ---
# These tasks disable the "No Valid Subscription" popup in the Proxmox web interface.

- name: Disable "No Valid Subscription" popup (non-minified)
  ansible.builtin.replace:
    path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
    regexp: "res.data.status.toLowerCase\\(\\) !== 'active'"
    replace: "false"
  notify: Restart pveproxy

- name: Disable "No Valid Subscription" popup (minified)
  ansible.builtin.replace:
    path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.min.js
    regexp: "\"active\"===e.data.status.toLowerCase\\(\\)"
    replace: "true"
  notify: Restart pveproxy
