---
# Proxmox Firewall Configuration via Proxmox API
# This role configures the built-in Proxmox firewall using the community.proxmox.proxmox_firewall module.
# Rules are applied via the Proxmox API, so they are immediately visible in the web UI.
#
# SAFE SEQUENCE (no service stop - prevents lockout on failure):
# 1. Pre-flight: validate SSH port is in the ruleset
# 2. Configure cluster-level firewall options (disabled initially) via API
# 3. Configure node-level firewall rules (INPUT chain — SSH, web UI, ICMPv6)
# 4. Enable firewall at cluster level via API
# 5. Verify firewall is active
#
# KEY SAFETY: We NEVER stop the service before writing configs.
# If the playbook fails mid-way, the firewall stays disabled and the user retains access.

# ============================================================
# PRE-FLIGHT: Validate SSH port safety
# ============================================================

- name: Get current Ansible connection port
  ansible.builtin.set_fact:
    proxmox_firewall_current_ssh_port: "{{ ansible_port | default(22) | int }}"

- name: Get custom SSH port from environment (TF_VAR_pm_ssh_port)
  ansible.builtin.set_fact:
    proxmox_firewall_env_ssh_port: "{{ lookup('env', 'TF_VAR_pm_ssh_port') | default('') }}"

- name: Validate SSH port is in firewall rules
  ansible.builtin.assert:
    that: >-
      proxmox_firewall_current_ssh_port == 22 or proxmox_firewall_env_ssh_port |
      string == proxmox_firewall_current_ssh_port | string
    fail_msg: >-
      LOCKOUT PREVENTION: Ansible is connected on port {{
      proxmox_firewall_current_ssh_port }}, but TF_VAR_pm_ssh_port is '{{
      proxmox_firewall_env_ssh_port }}'. The firewall would block your SSH
      access. Fix: Set TF_VAR_pm_ssh_port={{ proxmox_firewall_current_ssh_port
      }} or connect on port 22.
    success_msg: "SSH port {{ proxmox_firewall_current_ssh_port }} is allowed by
      firewall rules."
    quiet: false

# ============================================================
# Step 1: Get node hostname (short name) for node-level operations
# ============================================================

- name: Get current node short hostname
  ansible.builtin.command:
    cmd: hostname -s
  register: proxmox_firewall_node_hostname
  changed_when: false

# ============================================================
# Step 2: Configure cluster-level firewall options (initially disabled)
# ============================================================
# The community.proxmox.proxmox_firewall module does not support cluster options,
# so we use the Proxmox API directly.
# Endpoint: PUT /api2/json/cluster/firewall/options

- name: Configure cluster firewall options (initially disabled)
  ansible.builtin.uri:
    url: "{{ proxmox_api_base_url }}/cluster/firewall/options"
    method: PUT
    body:
      enable: 0
      policy_in: "DROP"
    body_format: form-urlencoded
    headers:
      Authorization: "PVEAPIToken={{ lookup('env', 'TF_VAR_pm_api_id') }}={{
        lookup('env', 'TF_VAR_pm_api_secret') }}"
    validate_certs: false
    status_code: 200

# ============================================================
# Step 2.5: Install required Python library for Proxmox API module
# ============================================================

- name: Install proxmoxer Python library
  ansible.builtin.apt:
    name: python3-proxmoxer
    state: present
  register: proxmox_firewall_proxmoxer_install
  changed_when: false

# ============================================================
# Step 3: Configure node-level firewall rules (INPUT chain)
# ============================================================
# These rules apply to host traffic (SSH, web UI, ICMPv6).
# All rules are managed as a single list for idempotency with update: true.

- name: Build node firewall rules list (base rules — always included)
  ansible.builtin.set_fact:
    proxmox_firewall_node_rules_base:
      # Block VMs from accessing critical Proxmox host services (IPv4)
      - type: in
        action: DROP
        source: "10.72.72.0/24"
        dport: "22,8006,3128,85,5900:5999,{{ lookup('env', 'TF_VAR_pm_ssh_port') }}"
        proto: tcp
        comment: "Block VMs from critical host ports (IPv4)"
        enable: true
        pos: 0
      # Block VMs from accessing critical Proxmox host services (IPv6 routed prefix)
      - type: in
        action: DROP
        source: "{{ proxmox_ipv6_prefix | default('::/0') }}"
        dport: "22,8006,3128,85,5900:5999,{{ lookup('env', 'TF_VAR_pm_ssh_port') }}"
        proto: tcp
        comment: "Block VMs from critical host ports (IPv6 routed)"
        enable: true
        pos: 1
      # Block VMs from accessing critical Proxmox host services via link-local IPv6
      - type: in
        action: DROP
        source: "fe80::/10"
        dport: "22,8006,3128,85,5900:5999,{{ lookup('env', 'TF_VAR_pm_ssh_port') }}"
        proto: tcp
        comment: "Block VMs from critical host ports (IPv6 link-local)"
        enable: true
        pos: 2
      - type: in
        action: ACCEPT
        source: "0.0.0.0/0"
        dport: "22"
        proto: tcp
        comment: "SSH access (port 22, IPv4)"
        enable: true
        pos: 3
      - type: in
        action: ACCEPT
        source: "::/0"
        dport: "22"
        proto: tcp
        comment: "SSH access (port 22, IPv6)"
        enable: true
        pos: 4
      - type: in
        action: ACCEPT
        source: "{{ fw_src_ip4 | default('0.0.0.0/0') }}"
        dport: "8006"
        proto: tcp
        comment: "Proxmox web UI + SSH (IPv4)"
        enable: true
        pos: 5
      - type: in
        action: ACCEPT
        source: "{{ fw_src_ip6 | default('::/0') }}"
        dport: "8006"
        proto: tcp
        comment: "Proxmox web UI + SSH (IPv6)"
        enable: true
        pos: 6
      - type: in
        action: ACCEPT
        source: "::/0"
        proto: ipv6-icmp
        comment: "IPv6 ICMP (ND, PMTUD, etc.)"
        enable: true
        pos: 7

- name: Build node firewall rules list (custom SSH port — merged with web UI)
  ansible.builtin.set_fact:
    proxmox_firewall_node_rules_custom:
      - type: in
        action: ACCEPT
        source: "{{ fw_src_ip4 | default('0.0.0.0/0') }}"
        dport: "8006,{{ lookup('env', 'TF_VAR_pm_ssh_port') }}"
        proto: tcp
        comment: "Proxmox web UI + SSH (IPv4)"
        enable: true
        pos: 5
      - type: in
        action: ACCEPT
        source: "{{ fw_src_ip6 | default('::/0') }}"
        dport: "8006,{{ lookup('env', 'TF_VAR_pm_ssh_port') }}"
        proto: tcp
        comment: "Proxmox web UI + SSH (IPv6)"
        enable: true
        pos: 6
  when: >-
    lookup('env', 'TF_VAR_pm_ssh_port') | default('') != '' and lookup('env',
    'TF_VAR_pm_ssh_port') | default('') != '22'

- name: Combine firewall rules (base only — standard SSH port 22)
  ansible.builtin.set_fact:
    proxmox_firewall_node_rules: "{{ proxmox_firewall_node_rules_base }}"
  when: >-
    lookup('env', 'TF_VAR_pm_ssh_port') | default('') == '' or lookup('env',
    'TF_VAR_pm_ssh_port') | default('') == '22'

- name: Combine firewall rules (base + custom SSH port merged)
  ansible.builtin.set_fact:
    proxmox_firewall_node_rules: >-
      {{ proxmox_firewall_node_rules_base[:5] +
      proxmox_firewall_node_rules_custom + proxmox_firewall_node_rules_base[7:]
      }}
  when: >-
    lookup('env', 'TF_VAR_pm_ssh_port') | default('') != '' and lookup('env',
    'TF_VAR_pm_ssh_port') | default('') != '22'

- name: Configure node firewall rules via API
  community.proxmox.proxmox_firewall:
    api_user: "{{ proxmox_api_user }}"
    api_token_id: "{{ proxmox_api_token_name }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    api_host: "{{ proxmox_api_base_url | regex_replace('^https?://([^:/]+).*', '\\1') }}"
    validate_certs: false
    level: node
    node: "{{ proxmox_firewall_node_hostname.stdout }}"
    state: present
    update: true
    rules: "{{ proxmox_firewall_node_rules }}"

# ============================================================
# Step 3.5: Pre-flight — verify SSH rules exist before enabling DROP
# ============================================================

- name: Get current node firewall rules (pre-flight check)
  ansible.builtin.uri:
    url: "{{ proxmox_api_base_url }}/nodes/{{ proxmox_firewall_node_hostname.stdout
      }}/firewall/rules"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ lookup('env', 'TF_VAR_pm_api_id') }}={{
        lookup('env', 'TF_VAR_pm_api_secret') }}"
    validate_certs: false
    status_code: 200
  register: proxmox_firewall_rules_check
  changed_when: false

- name: Verify SSH port 22 rule exists in firewall
  ansible.builtin.assert:
    that: >-
      proxmox_firewall_rules_check.json.data | selectattr('dport', 'defined') |
      selectattr('dport', 'equalto', '22') | selectattr('action', 'equalto',
      'ACCEPT') | list | length > 0
    fail_msg: >-
      LOCKOUT PREVENTION: SSH port 22 rule NOT found in node firewall rules.
      Cannot enable DROP policy without SSH access rule. Rules found: {{
      proxmox_firewall_rules_check.json.data | map(attribute='comment') | list
      }}
    success_msg: "SSH port 22 rule confirmed in firewall rules."
    quiet: false

# ============================================================
# Step 4: Enable firewall at cluster and node level (with safety checks)
# ============================================================

- name: Enable firewall at cluster level
  ansible.builtin.uri:
    url: "{{ proxmox_api_base_url }}/cluster/firewall/options"
    method: PUT
    body:
      enable: 1
      policy_in: "DROP"
    body_format: form-urlencoded
    headers:
      Authorization: "PVEAPIToken={{ lookup('env', 'TF_VAR_pm_api_id') }}={{
        lookup('env', 'TF_VAR_pm_api_secret') }}"
    validate_certs: false
    status_code: 200

# SAFETY: Check node firewall status before enabling
- name: Get current node firewall status
  ansible.builtin.uri:
    url: "{{ proxmox_api_base_url }}/nodes/{{ proxmox_firewall_node_hostname.stdout
      }}/firewall/options"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ lookup('env', 'TF_VAR_pm_api_id') }}={{
        lookup('env', 'TF_VAR_pm_api_secret') }}"
    validate_certs: false
    status_code: 200
  register: proxmox_firewall_node_status_before
  changed_when: false

- name: Display current node firewall status
  ansible.builtin.debug:
    msg: "Node firewall currently: {{ 'ENABLED' if
      proxmox_firewall_node_status_before.json.data.enable | default(0) | int ==
      1 else 'DISABLED' }}"

# SAFETY: Only enable if not already enabled (idempotent)
- name: Enable firewall at node level (only if currently disabled)
  ansible.builtin.uri:
    url: "{{ proxmox_api_base_url }}/nodes/{{ proxmox_firewall_node_hostname.stdout
      }}/firewall/options"
    method: PUT
    body:
      enable: 1
    body_format: form-urlencoded
    headers:
      Authorization: "PVEAPIToken={{ lookup('env', 'TF_VAR_pm_api_id') }}={{
        lookup('env', 'TF_VAR_pm_api_secret') }}"
    validate_certs: false
    status_code: 200
  when: >-
    proxmox_firewall_node_status_before.json.data.enable | default(0) | int == 0

# SAFETY: Verify SSH connectivity is still working after enabling
# NOTE: If SSH is lost, subsequent tasks won't run on this host.
# Recovery: Use Hetzner rescue mode to disable node firewall:
#   curl -k -X PUT https://<host>:8006/api2/json/nodes/<node>/firewall/options \
#     -H "Authorization: PVEAPIToken=<token>" -d "enable=0"
- name: Verify SSH connectivity after enabling node firewall
  ansible.builtin.wait_for_connection:
    timeout: 10
  ignore_errors: true
  register: proxmox_firewall_ssh_check

- name: Fail if SSH connectivity lost after enabling firewall
  ansible.builtin.fail:
    msg: >-
      LOCKOUT DETECTED: SSH connection lost after enabling node firewall. The
      node firewall is now ACTIVE and may be blocking your SSH port.

      RECOVERY OPTIONS: 1. If port 22 is blocked: Use Hetzner Robot rescue mode
      to access the host 2. Disable node firewall via API:
         curl -k -X PUT https://<host>:8006/api2/json/nodes/<node>/firewall/options
           -H "Authorization: PVEAPIToken=<token>" -d "enable=0"
      3. Or disable via Proxmox web UI: Node → Firewall → Options → Enable: No

      Then fix the firewall rules and re-run the playbook.
  when: proxmox_firewall_ssh_check.failed | default(false)

# ============================================================
# Step 5: Ensure pve-firewall service is running
# ============================================================
# The firewall config (enable: 1) is set via API, but the systemd service
# must also be running for rules to be enforced.

- name: Unmask pve-firewall service (may be masked by default)
  ansible.builtin.systemd:
    name: pve-firewall
    masked: false

- name: Ensure pve-firewall service is enabled and started
  ansible.builtin.systemd:
    name: pve-firewall
    enabled: true
    state: started
    daemon_reload: true

# ============================================================
# Step 6: Verify firewall is active (via SSH for status check)
# ============================================================
# Note: Proxmox automatically reloads the firewall when config changes via API.

- name: Wait for firewall to stabilize
  ansible.builtin.pause:
    seconds: 5

- name: Verify pve-firewall is running
  ansible.builtin.command:
    cmd: pve-firewall status
  register: proxmox_firewall_status
  changed_when: false
  failed_when: false

- name: Display firewall status
  ansible.builtin.debug:
    var: proxmox_firewall_status.stdout_lines
